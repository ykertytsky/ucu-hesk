services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hesk
      MYSQL_USER: hesk
      MYSQL_PASSWORD: hesk_local
    volumes:
      - hesk_mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8000:80"
    environment:
      HESK_DB_HOST: db
      HESK_DB_NAME: hesk
      HESK_DB_USER: hesk
      HESK_DB_PASSWORD: hesk_local
      HESK_URL: http://localhost:8000
      APACHE_DOCUMENT_ROOT: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

volumes:
  hesk_mysql_data:
